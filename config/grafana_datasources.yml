# =============================================================
#  Grafana Datasource — Auto-provisioned on startup
#  Connects Grafana to the Postgres alerts database
#  No manual setup needed — just open localhost:3000
# =============================================================

apiVersion: 1

datasources:
  - name: ColdChain-Postgres
    type: postgres
    url: postgres:5432
    user: airflow
    secureJsonData:
      password: airflow
    jsonData:
      database: airflow
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true
